# Alembic configuration for command-line use, e.g.:
#   alembic upgrade head          # apply migrations to DATABASE_URL
#   alembic revision --autogenerate -m "describe change"
# Dot Lab also applies migrations automatically on start-up.
# The database URL is read from DATABASE_URL / .env (see app/database/migrations/env.py).

[alembic]
script_location = app/database/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
